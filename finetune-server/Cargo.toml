[package]
name = "finetune-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["Hayden Stainsby <hds@caffeineconcepts.com>"]
readme = "README.md"
homepage = "https://github.com/hds/tracing-finetune"
repository = "https://github.com/hds/tracing-finetune"
description = """
A web-server that provides an API to control a `tracing-finetune` filter.
"""
categories = ["development-tools::debugging", "web-programming::http-server"]
keywords = ["tracing", "logging", "tracing-subscriber", "debugging", "server"]
publish = false

[features]
default = []
axum-router = [ "dep:axum" ]

[dependencies]
axum = { version = "0.8.9", features = [ "json" ], default-features = false, optional = true }
serde = "1.0.229"
tracing = { version = "0.1", default-features = false }

tracing-finetune = { version = "0.1.0", path = "../tracing-finetune" }

[dev-dependencies]
axum = { version = "0.8.9", default-features = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [ "full" ] }
tracing-subscriber = { version = "0.3.23", default-features = true }

[[example]]
name = "example-server-axum"
required-features = ["axum-router"]

[lints.clippy]
cargo = "deny"
complexity = "deny"
pedantic = "deny"
perf = "deny"
style = "deny"

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
